<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checklist de mazos · Star Wars Unlimited</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0e14; --panel:#131824; --panel2:#1a2130; --line:#263045; --text:#e6e9f0; --muted:#8a94a8;
  --accent:#f2c14e; --ok:#4cc38a; --miss:#e5626a; --blue:#5aa9e6;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg) radial-gradient(1200px 600px at 80% -10%,#1b2540 0%,transparent 60%);color:var(--text);font:15px/1.45 Inter,system-ui,sans-serif}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,.disp{font-family:"Chakra Petch",Inter,sans-serif;letter-spacing:.02em}
.app{display:grid;grid-template-columns:300px 1fr;min-height:100vh}
aside{border-right:1px solid var(--line);background:rgba(19,24,36,.85);padding:18px;display:flex;flex-direction:column;gap:14px}
main{padding:22px 28px;min-width:0}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{flex:none}
.brand h1{font-size:18px;margin:0;line-height:1.15}
.brand small{display:block;color:var(--muted);font:500 12px Inter}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:8px 12px;transition:.15s}
.btn:hover{border-color:#3a4766;background:#202a3d}
.btn.primary{background:var(--accent);color:#1a1400;border-color:var(--accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--miss)}
.btn.sm{padding:5px 9px;font-size:13px}
.upload{border:1.5px dashed #33405c;border-radius:var(--r);padding:14px;text-align:center;color:var(--muted);font-size:13px}
.upload .btn{width:100%;margin-bottom:8px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.opts .btn{padding:7px 4px;font-size:12.5px}
.steps{margin:0 0 12px;padding-left:20px;color:var(--muted);font-size:13.5px}
.steps li{margin-bottom:6px}
.steps b{color:var(--text)}
a.btn{text-decoration:none;display:inline-block;color:var(--accent)}
.link{color:var(--blue)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.thumbs img{height:90px;border-radius:6px;border:1px solid var(--line)}
.err{color:var(--miss);font-size:13px;margin-top:8px}
.note{color:var(--muted);font-size:12.5px;margin-top:6px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.row.hd{padding:7px 12px;background:var(--panel2);font:600 11px Inter;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.row.hd>span:nth-child(n+3){text-align:center}
.row .col{text-align:center;font:600 14px "Chakra Petch"}
.row .col.set span{background:#17243a;color:var(--blue);border-radius:5px;padding:2px 8px}
.row .col.none{color:var(--muted);font:400 13px Inter}
.ctr{justify-content:flex-end}
.unk{color:var(--muted);font-style:italic}
.right{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.homebtn{display:flex;align-items:center;gap:8px;width:100%;text-align:left}
.homebtn.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.brand{cursor:pointer}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.hero h2{margin:0;font-size:30px}
.hero p{margin:4px 0 0;color:var(--muted)}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.hstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:18px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.dcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:10px;transition:.15s;width:100%}
.dcard:hover{border-color:var(--accent);transform:translateY(-2px)}
.dcard .dn{font:600 18px/1.2 "Chakra Petch";margin:0}
.dcard .lb{display:flex;flex-direction:column;gap:4px;font-size:13px}
.dcard .lb div{display:flex;gap:6px;align-items:baseline;min-width:0}
.dcard .lb b{font:600 10.5px Inter;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);flex:none;width:44px}
.dcard .lb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dcard .lb .ldr{color:var(--accent)} .dcard .lb .bse{color:var(--blue)}
.dcard .pr{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.dcard .pr strong{color:var(--text);font:700 15px "Chakra Petch"}
.dcard .bar{height:8px;margin:0}
.dcard.done{border-color:rgba(76,195,138,.5)}
.dcard.newd{border-style:dashed;align-items:center;justify-content:center;color:var(--muted);min-height:170px;text-align:center}
.dcard.newd .plus{font:600 34px "Chakra Petch";color:var(--accent);line-height:1}
.hsearch{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.hsearch select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--text)}
@media (max-width:860px){body.onhome aside .upload,body.onhome aside .side-title,body.onhome aside .decklist,body.onhome #allMissing,body.onhome #homeBtn{display:none!important}}
@media (max-width:700px){.hstats{grid-template-columns:repeat(2,1fr)}}
.decklist{display:flex;flex-direction:column;gap:8px;overflow:auto}
.deckitem{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:10px 12px;text-align:left;width:100%}
.deckitem:hover{border-color:#3a4766}
.deckitem.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.deckitem .nm{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.deckitem .meta{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;margin-top:6px}
.bar{height:6px;background:#222b3d;border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#7be0ae);border-radius:4px}
.side-title{font:600 12px Inter;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:4px 0 -4px}
.status{font-size:12px;color:var(--muted);margin-top:auto;display:flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--ok)} .dot.warn{background:var(--accent)}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.head h2{margin:0;font-size:26px}
.head .sub{color:var(--muted);font-size:13px;margin-top:4px}
.head .actions{display:flex;gap:8px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{font:700 24px "Chakra Petch";display:block}
.stat span{font-size:12px;color:var(--muted)}
.stat.ok b{color:var(--ok)} .stat.miss b{color:var(--miss)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tab{background:none;border:0;padding:10px 14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:600}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text);border-bottom-color:var(--accent)}
.tab .c{font-weight:500;font-size:12px;background:var(--panel2);border-radius:10px;padding:1px 7px;margin-left:6px}
.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.search{flex:1;min-width:180px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.sec{margin-bottom:18px}
.sec h3{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px;display:flex;gap:8px;align-items:center}
.sec h3 .n{font:500 12px Inter;color:var(--muted)}
.rows{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:34px 1fr 90px 70px 150px;gap:10px;align-items:center;padding:8px 12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.done .cname{color:var(--muted)}
.chk{width:24px;height:24px;border-radius:6px;border:1.5px solid #3b4866;background:transparent;display:grid;place-items:center;padding:0}
.chk.part{border-color:var(--accent)}
.chk.full{background:var(--ok);border-color:var(--ok)}
.chk svg{display:none}.chk.full svg{display:block}
.chk.part::after{content:"";width:10px;height:2px;background:var(--accent);border-radius:2px}
.cname{font-weight:500;min-width:0}
.cname .t{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.cname .s{color:var(--muted);font-size:12.5px}
.code{font:600 11px "Chakra Petch";color:var(--blue);background:#17243a;border-radius:4px;padding:1px 6px;white-space:nowrap}
.edit{background:none;border:0;color:var(--muted);padding:2px;opacity:.6}
.edit:hover{opacity:1;color:var(--text)}
.ctr{display:flex;align-items:center;gap:6px}
.ctr button{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);padding:0}
.ctr button:hover{border-color:#3a4766}
.ctr .v{min-width:44px;text-align:center;font:600 14px "Chakra Petch"}
.pill{font-size:12px;border-radius:12px;padding:2px 9px;font-weight:600;white-space:nowrap}
.pill.miss{background:rgba(229,98,106,.15);color:var(--miss)}
.pill.ok{background:rgba(76,195,138,.15);color:var(--ok)}
.empty{color:var(--muted);text-align:center;padding:40px 20px;border:1px dashed var(--line);border-radius:var(--r)}
.welcome{max-width:720px;margin:40px auto;text-align:left}
.welcome h2{font-size:30px;margin:0 0 8px}
.welcome p{color:var(--muted)}
.welcome pre{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;font-size:12.5px;overflow:auto;color:#c6cddc}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
textarea{width:100%;min-height:160px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;resize:vertical;font:13px/1.4 ui-monospace,Menlo,monospace}
input.txt{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.modal{position:fixed;inset:0;background:rgba(5,7,12,.7);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal.on{display:flex}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;width:min(560px,100%);max-height:90vh;overflow:auto}
.modal h3{margin:0 0 12px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(30px);background:#202a3d;border:1px solid var(--line);padding:10px 16px;border-radius:10px;opacity:0;transition:.25s;z-index:30;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.dropping::after{content:"Suelta aquí tus mazos";position:fixed;inset:10px;border:2px dashed var(--accent);border-radius:16px;background:rgba(11,14,20,.85);display:grid;place-items:center;font:600 22px "Chakra Petch";color:var(--accent);z-index:40}
.decks-in{font-size:12px;color:var(--muted)}
.hidden{display:none!important}
@media (max-width:700px){
  .row{grid-template-columns:30px 1fr auto;grid-template-areas:"c n n" "c s r";row-gap:6px}
  .row.hd{display:none}
  .row>.chk{grid-area:c}.row>.cname{grid-area:n}.row>.meta2{grid-area:s;display:flex;gap:8px}.row>.right{grid-area:r}
  .row .col{text-align:left}
}
.meta2{display:contents}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  aside{border-right:0;border-bottom:1px solid var(--line)}
  .decklist{max-height:260px}
  main{padding:16px}
  .grid2{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(3,1fr)}
  .stat b{font-size:20px}
}
</style>
</head>

      <input type="file" id="imgfile" multiple accept="image/png,image/jpeg,image/webp,image/gif" class="hidden">

    <div class="status"><span class="dot" id="sdot"></span><span id="stext">Cargando…</span></div>
  </aside>
  <main id="main"></main>
</div>

<div class="modal" id="modal"><div class="box" id="mbox"></div></div>

/* ---------- parsing ---------- */
function splitId(id){
  const m=String(id||"").toUpperCase().match(/^([A-Z0-9]{2,5})[\s_\-#]*0*(\d{1,4})$/);
  return m?{set:m[1],num:m[2].padStart(3,"0")}:null;
}
function mk(o){
  const sid=splitId(o.id);
  const id=sid?sid.set+"_"+sid.num:(o.id?String(o.id).toUpperCase():"");
  const k=id||("n:"+norm(o.name)+"|"+norm(o.sub));
  return {k,id,name:(o.name||"").trim(),sub:(o.sub||"").trim(),sec:o.sec||"deck",n:Math.max(1,parseInt(o.n,10)||1),o:0};
}
function merge(cards){
  const m=new Map();
  for(const c of cards){
    const key=c.sec+"#"+c.k;
    if(m.has(key)){m.get(key).n+=c.n}else m.set(key,c);
  }
  return [...m.values()];
}
function parseJSON(obj,fallback){
  const cards=[];
  const add=(e,sec)=>{
    if(!e)return;
    if(typeof e==="string"){cards.push(mk({id:e,sec,n:1}));return}
    const id=e.id||e.cardId||e.card_id||(e.set&&e.number?e.set+"_"+e.number:"");
    if(!id&&!e.name)return;
    if(Number(e.count)===0||Number(e.quantity)===0)return;
    cards.push(mk({id,name:e.name||e.cardName||"",sub:e.subtitle||"",sec,n:e.count||e.quantity||1}));
  };
  add(obj.leader,"leader");add(obj.secondleader||obj.secondLeader,"leader");
  (obj.leaders||[]).forEach(e=>add(e,"leader"));
  add(obj.base,"base");(obj.bases||[]).forEach(e=>add(e,"base"));
  (obj.deck||obj.mainboard||obj.cards||[]).forEach(e=>add(e,"deck"));
  (obj.sideboard||[]).forEach(e=>add(e,"sideboard"));
  if(!cards.length)throw new Error("el JSON no contiene cartas reconocibles");
  const md=obj.metadata||{};
  return {name:md.name||obj.name||fallback,author:md.author||obj.author||"",cards:merge(cards)};
}
function secOf(line){
  const t=norm(line.replace(/\(.*?\)/g,"")).replace(/\s*\d+$/,"");
  if(/^(leaders?|lideres?|leader cards?)$/.test(t))return "leader";
  if(/^(bases?)$/.test(t))return "base";
  if(/^(deck|mazo|main ?deck|main|mainboard|cartas|cards|ground units?|space units?|units?|events?|upgrades?|unidades|eventos|mejoras)$/.test(t))return "deck";
  if(/^(sideboard|banquillo|side)$/.test(t))return "sideboard";
  return null;
}
function parseText(txt,fallback){
  let name=fallback, sec="deck", seenSec=false;
  const cards=[];
  for(let raw of txt.split(/\r?\n/)){
    let line=raw.trim();
    if(!line||/^\/\//.test(line))continue;
    let m=line.match(/^(?:#+\s*)?(?:nombre|name|deck name|mazo)\s*[:=]\s*(.+)$/i);
    if(m){name=m[1].trim();continue}
    const s=secOf(line.replace(/^#+\s*/,"").replace(/:$/,""));
    if(s){sec=s;seenSec=true;continue}
    let n=null,rest=null;
    m=line.match(/^(\d{1,2})\s*[x×]?\s*[|,;\t]?\s*(.+)$/i);
    if(m){n=+m[1];rest=m[2]}
    else if((m=line.match(/^(.+?)\s+[x×]\s*(\d{1,2})$/i))){n=+m[2];rest=m[1]}
    else{n=1;rest=line}
    rest=rest.replace(/^[|,;\t\s]+/,"");
    let id="";
    // set code: "(SOR) 010", "[SOR 010]", "SOR_010" or "| SOR | 010"
    let cm=rest.match(/[\[(]\s*([A-Z]{2,5})\s*[\])]?\s*[-_#\s]?\s*0*(\d{1,4})\s*\]?\s*$/);
    if(!cm)cm=rest.match(/(?:^|\s|\|)([A-Z]{2,5})(?:_|\s+|\s*\|\s*)0*(\d{1,4})\s*$/);
    if(cm){id=cm[1]+"_"+cm[2];rest=rest.slice(0,cm.index).trim().replace(/[|,;\-–]+$/,"").trim()}
    let parts=rest.split(/\s*\|\s*/).filter(Boolean);
    let nm=parts[0]||"", sub=parts[1]||"";
    if(!nm&&!id)continue;
    if(/^[A-Z]{2,5}_\d+$/i.test(nm)&&!id){id=nm;nm=""}
    cards.push(mk({id,name:nm,sub,sec,n}));
  }
  if(!cards.length)throw new Error("no se encontraron líneas de cartas");
  // if no sections given, guess: a single 1-copy first card is often the leader → leave as deck
  return {name,author:"",cards:merge(cards)};
}
function parseAny(txt,fallback){
  const t=txt.trim();
  if(t.startsWith("{")||t.startsWith("[")){
    let obj=JSON.parse(t);
    if(Array.isArray(obj))obj={deck:obj};
    return parseJSON(obj,fallback);
  }
  return parseText(t,fallback);
}

/* ---------- base de nombres ---------- */
const VAROFF={ASH:[264,502]};
function lookupDirect(id){const sid=splitId(id);if(!sid)return null;const S_=CARDDB[sid.set];return S_&&S_.b[sid.num]||null}
function lookupVariant(id){
  const sid=splitId(id);if(!sid)return null;const S_=CARDDB[sid.set];if(!S_)return null;
  const n=parseInt(sid.num,10);
  const bn=S_.v[String(n)];
  if(bn){const k=String(bn).padStart(3,"0");return S_.b[k]?[...S_.b[k],sid.set+"_"+k]:null}
  const offs=VAROFF[sid.set];if(!offs)return null;
  const size=Math.max(...Object.keys(S_.b).map(Number));
  for(const off of [...offs].sort((a,b)=>b-a)){const m=n-off;if(n>off&&m>=1&&m<=size){const k=String(m).padStart(3,"0");return S_.b[k]?[...S_.b[k],sid.set+"_"+k]:null}}
  return null;
}

const LSX="swu-checklist-xdb-v1";

let XDB={};
function applyXdb(set,data){if(data&&data.b&&typeof data.b==="object")CARDDB[set]={b:data.b,v:data.v||{}}}
function loadXdbLocal(){try{XDB=JSON.parse(localStorage.getItem(LSX)||"{}")||{}}catch(e){XDB={}}for(const [k,v] of Object.entries(XDB))applyXdb(k,v)}
function saveXdbLocal(){try{localStorage.setItem(LSX,JSON.stringify(XDB))}catch(e){}}
function field(o,names){for(const k of Object.keys(o)){if(names.includes(k.toLowerCase()))return o[k]}return undefined}
function parseApiJson(text){
  let obj;
  try{obj=JSON.parse(text)}catch(e){
    const i=Math.min(...["{","["].map(c=>{const x=text.indexOf(c);return x<0?Infinity:x})),j=Math.max(text.lastIndexOf("}"),text.lastIndexOf("]"));
    try{obj=JSON.parse(text.slice(i,j+1))}catch(e2){throw new Error("no es el texto de la lista; copia la página entera (Ctrl+A y Ctrl+C). En Firefox, pulsa antes «Datos sin procesar»")}
  }
  const arr=Array.isArray(obj)?obj:(obj.data||obj.cards||obj.results||[]);
  if(!Array.isArray(arr)||!arr.length)throw new Error("no contiene cartas");
  const sets={};
  for(const e of arr){
    if(!e||typeof e!=="object")continue;
    const set=String(field(e,["set","setcode","set_code","expansion"])||"").toUpperCase().trim();
    const num=String(field(e,["number","cardnumber","card_number","num"])||"").trim();
    const name=String(field(e,["name","cardname"])||"").trim();
    const sub=String(field(e,["subtitle","title"])||"").trim();
    if(!set||!/^\d{1,4}$/.test(num)||!name)continue;
    const g=(sets[set]=sets[set]||{});const key=name+"|"+sub;
    (g[key]=g[key]||{name,sub,nums:new Set()}).nums.add(parseInt(num,10));
  }
  const out={};
  for(const [set,groups] of Object.entries(sets)){
    const b={},v={};
    for(const g of Object.values(groups)){const ns=[...g.nums];const base=Math.min(...ns);b[String(base).padStart(3,"0")]=[g.name,g.sub];for(const n of ns)if(n!==base)v[String(n)]=base}
    out[set]={b,v};
  }
  if(!Object.keys(out).length)throw new Error("no he encontrado cartas con expansión, número y nombre");
  return out;
}

function saveXdbRemote(set){

function parseCodes(str){
  str=String(str||"");
  const re=/\b([A-Za-z][A-Za-z0-9]{1,4})[\s_\-]+0*(\d{1,4})\b/g;let m;const out=[];
  while((m=re.exec(str)))out.push(m[1].toUpperCase()+"_"+m[2].padStart(3,"0"));
  if(!out.length)return null;
  const rest=str.replace(re,"").replace(/[\s,;|\/]+/g,"");
  return rest?null:out;
}
function enrich(d){
  let ch=false;
  for(const c of d.cards){
    const codes=c.name?parseCodes(c.name):null;
    if(codes){c.alt=codes;c.name="";if(!c.id){const promo=x=>/^P\d/.test(x)?1:0;c.id=[...codes].sort((a,b)=>promo(a)-promo(b)||parseInt(splitId(a).num)-parseInt(splitId(b).num))[0]}ch=true}
    if(c.name)continue;
    const ids=[c.id,...(c.alt||[])].filter(Boolean);
    let v=null;
    for(const id of ids){v=lookupDirect(id);if(v){if(id!==c.id)c.bid=id;break}}
    if(!v)for(const id of ids){v=lookupVariant(id);if(v){c.bid=v[2];break}}
    if(v){c.name=v[0];if(!c.sub)c.sub=v[1];ch=true}
  }
  return ch;
}

/* ---------- helpers ---------- */
const label=c=>c.name||(c.id?"Nombre desconocido":"Carta sin nombre");
const codeOf=c=>(c.bid||c.id)?(c.bid||c.id).replace("_"," "):"";
function totals(d){
  let n=0,o=0,dn=0,dm=0;
  for(const c of d.cards){n+=c.n;o+=Math.min(c.o,c.n);dn++;if(c.o<c.n)dm++}
  return {n,o,miss:n-o,pct:n?Math.round(o*100/n):0,distinct:dn,distinctMiss:dm,distinctOwned:d.cards.filter(c=>c.o>0).length};
}
function sortedDecks(){return Object.entries(S.decks).sort((a,b)=>(a[1].createdAt||0)-(b[1].createdAt||0))}

/* ---------- persistence ---------- */
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S.decks))}catch(e){}}
function loadLocal(){try{const v=JSON.parse(localStorage.getItem(LS)||"{}");return v&&typeof v==="object"?v:{}}catch(e){return {}}}
function body(d){return {name:d.name,author:d.author||"",url:d.url||"",createdAt:d.createdAt||Date.now(),cards:d.cards.map(c=>{const o={k:c.k,id:c.id,name:c.name,sub:c.sub,sec:c.sec,n:c.n,o:c.o};if(c.alt)o.alt=c.alt;if(c.bid)o.bid=c.bid;return o})}}
function persist(id){
  saveLocal();

  clearTimeout(timers[id]);

function flush(id){
  chains[id]=(chains[id]||Promise.resolve()).then(async()=>{
    const d=S.decks[id];
    try{
      if(d)await col.doc(id).set(body(d));else await col.doc(id).delete();
      setStatus("on","Guardado en tu cuenta");
    }catch(e){
      if(e&&e.code==="unavailable"){await new Promise(r=>setTimeout(r,800+Math.random()*800));try{d?await col.doc(id).set(body(d)):await col.doc(id).delete()}catch(_){setStatus("warn","No se pudo guardar en la nube · guardado en este navegador")}}
      else if(e&&e.code==="quota_exceeded")toast("Se alcanzó el límite de almacenamiento: borra algún mazo.");
      else setStatus("warn","Guardado solo en este navegador");
    }finally{dirty.delete(id)}
  });
}
function removeDeck(id){
  delete S.decks[id];

async function initRemote(){
  try{
    if(!window.claude||!window.claude.use){setStatus("warn","Guardado solo en este navegador");return}
    const [d,u]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!d||!u){setStatus("warn","Guardado solo en este navegador");return}
    const id=await u.id();
    if(!id){setStatus("warn","Guardado solo en este navegador");return}

    const timer=setTimeout(()=>{if(first)setStatus("warn","No se puede conectar con la nube todavía · usando este navegador")},10000);
    col.onSnapshot(snap=>{
      if(!snap.metadata.fromCache)clearTimeout(timer);
      if(first&&!snap.metadata.fromCache){
        first=false;remote=true;
        const ids=new Set(snap.docs.map(x=>x.id));
        for(const set of Object.keys(XDB))if(!ids.has("xdb_"+set)){saveXdbRemote(set)}
        // migrate local-only decks into the account
        for(const k of Object.keys(S.decks))if(!ids.has(k)&&!k.startsWith("xdb_")){dirty.add(k);flush(k)}
        setStatus("on","Guardado en tu cuenta");
      }
      for(const ch of snap.docChanges()){
        const k=ch.doc.id;
        if(k.startsWith("xdb_")){if(ch.type!=="removed"){const b=ch.doc.data();const set=k.slice(4);if(b&&b.b){XDB[set]=JSON.parse(JSON.stringify(b));applyXdb(set,XDB[set]);saveXdbLocal();for(const d of Object.values(S.decks))enrich(d)}}continue}
        if(dirty.has(k))continue;
        if(ch.type==="removed"){if(!snap.metadata.fromCache)delete S.decks[k]}
        else{const b=ch.doc.data();if(b&&Array.isArray(b.cards)){S.decks[k]=JSON.parse(JSON.stringify(b));enrich(S.decks[k])}}
      }
      if(S.sel&&!S.decks[S.sel])S.sel=null;
      if(!S.sel)S.sel=sortedDecks()[0]?.[0]||null;
      saveLocal();render();
    },err=>{clearTimeout(timer);remote=false;setStatus("warn","Guardado solo en este navegador")});
  }catch(e){setStatus("warn","Guardado solo en este navegador")}
}

/* ---------- import ---------- */
function addDecks(list){
  let last=null;
  for(const p of list){
    const id=newId();
    enrich(p);
    S.decks[id]={name:p.name||"Mazo sin nombre",author:p.author||"",url:p.url||"",createdAt:Date.now()+Object.keys(S.decks).length,cards:p.cards};
    last=id;persist(id);
  }
  if(last){if(list.length>1){S.view="home"}else{S.sel=last;S.view="deck";S.tab="full"}}
  render();
}
async function importFiles(files){
  const ok=[],bad=[];
  for(const f of files){
    try{const txt=await f.text();ok.push(parseAny(txt,f.name.replace(/\.[^.]+$/,"")))}
    catch(e){bad.push(f.name+" ("+(e.message||"formato no válido")+")")}
  }
  if(ok.length)addDecks(ok);
  toast((ok.length?ok.length+(ok.length===1?" mazo importado":" mazos importados"):"Ningún mazo importado")+(bad.length?" · No se pudo leer: "+bad.join(", "):""));
}

function modal(html,onOk){
  $("mbox").innerHTML=html;$("modal").classList.add("on");

  $("mbox").onclick=e=>{
    const a=e.target.closest("[data-m]");if(!a)return;
    if(a.dataset.m==="ok"){if(onOk&&onOk()===false)return}

  };
  $("mbox").onkeydown=e=>{if(e.key==="Enter"&&e.target.tagName==="INPUT"){e.preventDefault();$("mbox").querySelector('[data-m="ok"]').click()}if(e.key==="Escape")$("modal").classList.remove("on")};
}

TWI_016 Jango Fett
Cuartel General | SOR 025</pre>

        let line=raw.trim();if(!line)continue;

        const parts=rest.replace(/^[|,;\s]+|[|,;\s]+$/g,"").split(/\s*\|\s*/).filter(Boolean);

      setTimeout(()=>$("ltext").focus(),30);return false;
    }
    const txt=$("ltext").value.trim();
    if(!txt){$("lerr2").textContent="Pega primero el mazo exportado desde SWUDB.";$("lerr2").classList.remove("hidden");return false}
    if(SWUDB_RE.test(txt)){$("lerr2").textContent="Has pegado el enlace otra vez: hace falta el contenido que copias con «Export» en SWUDB.";$("lerr2").classList.remove("hidden");return false}
    try{
      const p=parseAny(txt,"Mazo SWUDB "+m[1]);
      if($("lname").value.trim())p.name=$("lname").value.trim();
      p.url=url;addDecks([p]);toast("Mazo añadido desde SWUDB");
    }catch(e){$("lerr2").textContent="No se pudo leer lo pegado: "+(e.message||"formato no válido");$("lerr2").classList.remove("hidden");return false}
  });
  if(pre&&SWUDB_RE.test(pre))setTimeout(()=>$("lok").click(),0);
}

/* ---------- imagen ---------- */
let samplePromise=null;
function getSample(){
  if(!samplePromise)samplePromise=(async()=>{try{return window.claude&&window.claude.use?await window.claude.use("sample"):null}catch(e){return null}})();
  return samplePromise;
}
function toText(r){
  const L=[];
  if(r.name)L.push("Nombre: "+r.name);
  const line=c=>{
    const n=Math.max(1,parseInt(c.count,10)||1);
    let s=n+" | "+String(c.name||"").trim();
    if(c.subtitle)s+=" | "+String(c.subtitle).trim();
    if(c.set&&c.number)s+=" | "+String(c.set).toUpperCase()+" "+String(c.number).replace(/\D/g,"").padStart(3,"0");
    return s;
  };
  const blocks=[["Líder",r.leaders],["Base",r.bases],["Mazo",r.deck],["Banquillo",r.sideboard]];
  for(const [h,arr] of blocks){const a=(Array.isArray(arr)?arr:[]).filter(c=>c&&(c.name||c.set));if(a.length){L.push(h);a.forEach(c=>L.push(line(c)))}}
  return L.join("\n");
}
const IMG_PROMPT=`Las imágenes adjuntas muestran UN mazo del juego de cartas Star Wars: Unlimited (puede ser una captura de SWUDB u otra web, una lista escrita o una foto de cartas físicas; si hay varias imágenes son partes del mismo mazo).
Lee todas las cartas y responde SOLO con un objeto JSON con esta forma:
{"name":"nombre del mazo o cadena vacía","leaders":[C],"bases":[C],"deck":[C],"sideboard":[C]}
donde cada C es {"count":número de copias,"name":"nombre de la carta tal como aparece","subtitle":"subtítulo o cadena vacía","set":"código de expansión de 3 letras (SOR, SHD, TWI, JTL, LOF, SEC...) o cadena vacía","number":"número de carta o cadena vacía"}.
Reglas: los líderes van en "leaders" y la base en "bases"; el resto en "deck" salvo que se indique banquillo/sideboard. Si en una foto de cartas físicas hay varias copias iguales, cuéntalas. No inventes cartas que no se vean; si no puedes leer un dato déjalo vacío. Si la imagen no contiene un mazo de Star Wars: Unlimited responde {"error":"explicación breve"}.`;
async function imageModal(){
  const sample=await getSample();
  let lim=null;
  if(sample){try{lim=await sample.limits()}catch(e){}}
  if(!sample||!lim||!lim.images){
    modal(`<h3>Importar desde imagen</h3><p>La lectura de imágenes no está disponible en esta vista (hace falta abrir la página en Claude con la sesión iniciada). Mientras tanto puedes usar <b>Pegar lista</b> o subir el archivo del mazo.</p><div class="acts"><button class="btn primary" data-m="ok">Entendido</button></div>`);
    return;
  }
  let files=[], ctl=null, busy=false;
  modal(`<h3>Importar desde imagen</h3>
    <p class="note" style="margin-top:0">Sube una captura de SWUDB, una foto de las cartas o una lista escrita. Si el mazo ocupa varias capturas, selecciónalas juntas (máx. ${lim.images.maxCount}). Claude leerá las cartas y podrás revisar el resultado antes de añadirlo.</p>
    <button class="btn" id="ipick">Elegir imagen…</button>
    <div class="thumbs" id="ithumbs"></div>
    <div id="iout" class="hidden">
      <p class="note">Revisa la lista y corrige lo que haga falta (una carta por línea: copias | nombre | subtítulo | código).</p>
      <textarea id="itext"></textarea>
    </div>
    <div class="note hidden" id="ibusy"><span class="spin"></span>Leyendo la imagen… puede tardar hasta un minuto.</div>
    <div class="err hidden" id="ierr"></div>
    <div class="acts"><button class="btn" data-m="cancel" id="icancel">Cancelar</button><button class="btn primary" data-m="ok" id="iok" disabled>Leer imagen</button></div>`,()=>{
      if(busy)return false;
      if($("iout").classList.contains("hidden")){run();return false}
      try{const p=parseAny($("itext").value,"Mazo desde imagen");addDecks([p]);toast("Mazo añadido desde imagen · revisa que esté bien")}
      catch(e){showErr("No se pudo leer la lista: "+(e.message||"formato no válido"));return false}
  });
  const showErr=m=>{$("ierr").textContent=m;$("ierr").classList.toggle("hidden",!m)};
  $("ipick").onclick=()=>{$("imgfile").value="";$("imgfile").click()};
  $("imgfile").onchange=e=>{
    files=[...e.target.files].slice(0,lim.images.maxCount);
    $("ithumbs").innerHTML="";
    files.forEach(f=>{const im=document.createElement("img");im.src=URL.createObjectURL(f);im.alt=f.name;$("ithumbs").append(im)});
    $("iok").disabled=!files.length;$("iok").textContent="Leer imagen";$("iout").classList.add("hidden");showErr("");
    if(e.target.files.length>lim.images.maxCount)showErr("Solo se usarán las primeras "+lim.images.maxCount+" imágenes.");
  };
  $("icancel").addEventListener("click",()=>{if(ctl)ctl.abort()},true);
  async function run(){
    if(!files.length)return;
    busy=true;ctl=new AbortController();
    $("iok").disabled=true;$("ipick").disabled=true;$("ibusy").classList.remove("hidden");showErr("");
    try{
      const r=await sample.json(IMG_PROMPT,{images:files,signal:ctl.signal});
      if(!r||typeof r!=="object")throw {code:"invalid_json"};
      if(r.error){showErr("No parece un mazo: "+r.error);return}
      const txt=toText(r);
      if(!txt.trim()||!/\n\d/.test("\n"+txt)){showErr("No se encontraron cartas en la imagen. Prueba con una captura más nítida.");return}
      $("itext").value=txt;$("iout").classList.remove("hidden");$("iok").textContent="Añadir mazo";
    }catch(e){
      const c=e&&e.code;
      if(c==="cancelled")return;
      showErr(c==="not_granted"||c==="sampling_disabled"?"No se ha permitido que la página use Claude, así que no puede leer imágenes.":
        c==="rate_limited"?"Has hecho demasiadas lecturas seguidas o has llegado a tu límite de uso. Inténtalo más tarde.":
        c==="image_rejected"?"Esa imagen no se puede usar (formato o tamaño). Prueba con otra en JPG o PNG.":
        c==="invalid_json"||c==="empty_completion"?"No se pudo interpretar la imagen. Prueba otra vez o con una captura más nítida.":
        c==="refused"?"Claude no ha podido procesar esa imagen. Prueba con otra.":
        "Ha fallado la lectura. Vuelve a intentarlo.");
    }finally{busy=false;ctl=null;$("ibusy").classList.add("hidden");$("ipick").disabled=false;$("iok").disabled=!files.length}
  }
}

/* ---------- events ---------- */
document.addEventListener("click",async e=>{
  if(e.target.closest(".brand")){S.view="home";render();return}
  const dk=e.target.closest("[data-deck]");
  if(dk){S.sel=dk.dataset.deck;S.view="deck";S.q="";render();window.scrollTo(0,0);return}
  if(e.target.closest("#allMissing")){S.view="all";render();return}
  const tb=e.target.closest("[data-tab]");
  if(tb){S.tab=tb.dataset.tab;render();return}
  const a=e.target.closest("[data-act]");if(!a)return;
  const act=a.dataset.act, d=S.decks[S.sel], c=d&&a.dataset.i!=null?d.cards[+a.dataset.i]:null;
  switch(act){
    case "upload":$("file").click();break;
    case "paste":pasteModal();break;
    case "link":linkModal("");break;
    case "names":namesModal();break;
    case "home":S.view="home";render();window.scrollTo(0,0);break;
    case "allmiss":e.preventDefault();S.view="all";render();break;
    case "image":imageModal();break;
    case "toggle":c.o=c.o>=c.n?0:c.n;persist(S.sel);render();break;
    case "fill":c.o=c.n;persist(S.sel);render();break;
    case "inc":if(c.o<c.n){c.o++;persist(S.sel);render()}break;
    case "dec":if(c.o>0){c.o--;persist(S.sel);render()}break;
    case "all":d.cards.forEach(x=>x.o=x.n);persist(S.sel);render();break;
    case "reset":modal(`<h3>Reiniciar «${esc(d.name)}»</h3><p>Todas las cartas de este mazo volverán a marcarse como faltantes.</p><div class="acts"><button class="btn" data-m="cancel">Cancelar</button><button class="btn primary" data-m="ok">Reiniciar</button></div>`,()=>{d.cards.forEach(x=>x.o=0);persist(S.sel);render()});break;
    case "del":{const id=S.sel;modal(`<h3>Eliminar «${esc(d.name)}»</h3><p>Se borrará el mazo y lo que has marcado en él.</p><div class="acts"><button class="btn" data-m="cancel">Cancelar</button><button class="btn primary" data-m="ok" style="background:var(--miss);border-color:var(--miss);color:#fff">Eliminar</button></div>`,()=>removeDeck(id));break}
    case "renameDeck":modal(`<h3>Renombrar mazo</h3><input class="txt" id="rn" value="${esc(d.name)}"><div class="acts"><button class="btn" data-m="cancel">Cancelar</button><button class="btn primary" data-m="ok">Guardar</button></div>`,()=>{const v=$("rn").value.trim();if(!v)return false;d.name=v;persist(S.sel);render()});break;
    case "rename":modal(`<h3>Nombre de la carta</h3>${c.id?`<p class="decks-in">Código <span class="code">${esc(codeOf(c))}</span> · el nombre se aplicará en todos tus mazos que la incluyan.</p>`:""}<input class="txt" id="cn" placeholder="Nombre" value="${esc(c.name)}" style="margin-bottom:8px"><input class="txt" id="cs" placeholder="Subtítulo (opcional)" value="${esc(c.sub)}"><div class="acts"><button class="btn" data-m="cancel">Cancelar</button><button class="btn primary" data-m="ok">Guardar</button></div>`,()=>{
      const nm=$("cn").value.trim(),sb=$("cs").value.trim(),k=c.k;
      for(const [id,dd] of Object.entries(S.decks)){let ch=false;for(const x of dd.cards)if(x.k===k&&(c.id||id===S.sel)){x.name=nm;x.sub=sb;ch=true}if(ch)persist(id)}
      render()});break;
    case "copy":case "copyAll":{
      let lines=[];
      if(act==="copy"){lines.push("Faltantes · "+d.name);for(const s of ORDER)for(const x of d.cards)if(x.sec===s&&x.o<x.n)lines.push(`${x.n-x.o} ${label(x)}${x.sub?" | "+x.sub:""}${x.id?" ("+codeOf(x)+")":""}`)}
      else{const agg=new Map();for(const [,dd] of sortedDecks())for(const x of dd.cards){const m=x.n-x.o;if(m>0){const v=agg.get(x.k)||{x,m:0};v.m+=m;agg.set(x.k,v)}}lines.push("Faltantes de todos los mazos");for(const {x,m} of agg.values())lines.push(`${m} ${label(x)}${x.sub?" | "+x.sub:""}${x.id?" ("+codeOf(x)+")":""}`)}
      const text=lines.join("\n");
      try{await navigator.clipboard.writeText(text);toast("Lista copiada al portapapeles")}
      catch(_){modal(`<h3>Copia la lista</h3><textarea readonly>${esc(text)}</textarea><div class="acts"><button class="btn primary" data-m="ok">Cerrar</button></div>`)}
      break}
  }
});
document.addEventListener("change",e=>{if(e.target.id==="hsort"){S.hsort=e.target.value;render()}});
document.addEventListener("input",e=>{
  if(e.target.id==="hq"){S.hq=e.target.value;const pos=e.target.selectionStart;render();const q=$("hq");if(q){q.focus();q.setSelectionRange(pos,pos)}return}
  if(e.target.id==="q"){S.q=e.target.value;const pos=e.target.selectionStart;render();const q=$("q");if(q){q.focus();q.setSelectionRange(pos,pos)}}
});
$("btnUpload").onclick=()=>$("file").click();
$("file").onchange=e=>{const f=[...e.target.files];e.target.value="";if(f.length)importFiles(f)};
let dragN=0;
window.addEventListener("dragenter",e=>{if(e.dataTransfer&&[...e.dataTransfer.types].includes("Files")){e.preventDefault();dragN++;document.body.classList.add("dropping")}});
window.addEventListener("dragover",e=>{e.preventDefault()});
window.addEventListener("dragleave",()=>{dragN=Math.max(0,dragN-1);if(!dragN)document.body.classList.remove("dropping")});
window.addEventListener("drop",e=>{e.preventDefault();dragN=0;document.body.classList.remove("dropping");const f=[...(e.dataTransfer?.files||[])];if(f.length)importFiles(f)});

/* ---------- start ---------- */
loadXdbLocal();
S.decks=loadLocal();
for(const d of Object.values(S.decks))enrich(d);
S.sel=sortedDecks()[0]?.[0]||null;
setStatus("","Conectando…");
render();
initRemote();
})();
